<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="refresh" content="4;url=/?fresh=1#mobile" />
    <title>Aktualizacja QCteam</title>
    <style>
      html, body { margin: 0; min-height: 100dvh; background: #1F5C3E; color: #F6F8F5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 32px 24px; }
      h1 { font-size: 28px; margin: 0 0 12px; }
      p { font-size: 17px; line-height: 1.4; margin: 0 0 18px; opacity: .92; }
      a { color: #F6F8F5; font-weight: 600; }
    </style>
  </head>
  <body>
    <div>
      <h1>Aktualizuję QCteam…</h1>
      <p>Czyszczę starą kopię z telefonu. Zaraz wrócisz do aplikacji.</p>
      <p><a href="/?fresh=1#mobile">Jeśli nic się nie dzieje — tapnij tutaj</a></p>
    </div>
    <script>
      (async () => {
        try { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); } catch (e) {}
        try { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); } catch (e) {}
        location.replace("/?fresh=" + Date.now() + "#mobile");
      })();
    </script>
  </body>
</html>
